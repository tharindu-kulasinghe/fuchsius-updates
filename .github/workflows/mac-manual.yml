name: Build manual Mac installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing released source version
        required: true
        default: v1.0.0

permissions:
  contents: read

concurrency:
  group: manual-mac-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Validate source version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Choose an existing stable source version.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: tharindu-kulasinghe/fuchsius_system
          ssh-key: ${{ secrets.SOURCE_REPOSITORY_SSH_KEY }}
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Verify package version
        run: node -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) throw Error("Source version mismatch")'
      - run: npm ci
      - run: npm run check
      - run: npm run build:renderer
      - name: Build a manual DMG with automatic Mac updates disabled
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never -c.mac.identity=- -c.mac.notarize=false -c.extraMetadata.macAutoUpdates=false
      - name: Verify the complete local signature and disabled update setting
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/verify-mac-signature.cjs "$BUILD_ARCH"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import * as asar from '@electron/asar';
          const folder = process.env.BUILD_ARCH === 'x64' ? 'mac' : 'mac-' + process.env.BUILD_ARCH;
          const archive = `dist/${folder}/Fuchsius.app/Contents/Resources/app.asar`;
          const pkg = JSON.parse(asar.extractFile(archive, 'package.json'));
          if (pkg.macAutoUpdates !== false || 'v' + pkg.version !== process.env.RELEASE_TAG) throw Error('Manual Mac package must have the correct version and updates disabled.');
          console.log('Verified manual Mac version and disabled automatic updates.');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: manual-mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manual-mac-*
          path: manual-mac
          merge-multiple: true
      - name: Attach only manual Mac installers to the existing release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > current-release.json
          python3 - <<'PY_CHECK'
          import json
          from pathlib import Path
          data = json.loads(Path('current-release.json').read_text())
          if any(a['name'] == 'latest-mac.yml' or a['name'].endswith('.zip') for a in data['assets']):
              raise SystemExit('Manual installers must not replace an Apple-signed automatic update release.')
          PY_CHECK
          for arch in arm64 x64; do
            test -f "manual-mac/Fuchsius-${RELEASE_TAG#v}-${arch}.dmg"
          done
          while IFS= read -r -d '' file; do
            gh release upload "$RELEASE_TAG" "$file" --clobber
          done < <(find manual-mac -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.dmg.blockmap' \) -print0 | sort -z)
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > published-release.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('published-release.json').read_text())
          if any(a['name'] == 'latest-mac.yml' or a['name'].endswith('.zip') for a in data['assets']):
              raise SystemExit('A manual Mac release must not publish an automatic update feed.')
          message = 'Mac DMGs are available for manual installation on Apple Silicon (arm64) and Intel (x64). Mac automatic updates are disabled. These temporary builds have a verified ad-hoc signature, but are not Apple Developer ID signed or notarized; macOS may require approval for an app downloaded from the internet. Use only the company download links. Signed/notarized Mac automatic updates will be enabled separately when Apple Developer setup is ready.'
          body = data.get('body') or ''
          if message not in body:
              body += '\n\n' + message
          Path('manual-mac-notes.txt').write_text(body)
          PY
          gh release edit "$RELEASE_TAG" --notes-file manual-mac-notes.txt
