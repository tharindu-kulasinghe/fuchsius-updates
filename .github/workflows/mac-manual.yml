name: Mac distribution paused

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the signed Mac release path
        run: |
          echo 'Mac distribution is temporarily paused. No installers are built or uploaded.'
          echo 'Use the signed release pipeline after configuring Apple Developer ID signing and notarization.'
          echo 'Enable the MAC_AUTO_UPDATES_ENABLED repository variable only after reviewing that setup.'
