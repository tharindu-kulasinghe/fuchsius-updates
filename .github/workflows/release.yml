name: Publish Fuchsius installers

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      matrix: ${{ steps.release.outputs.matrix }}
      platforms: ${{ steps.release.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tharindu-kulasinghe/fuchsius_system
          ssh-key: ${{ secrets.SOURCE_REPOSITORY_SSH_KEY }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - name: Check for a new private source version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_MAC_SIGNING: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
        run: node scripts/prepare-public-release.cjs

  validate:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tharindu-kulasinghe/fuchsius_system
          ssh-key: ${{ secrets.SOURCE_REPOSITORY_SSH_KEY }}
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install Linux native build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libxrandr-dev libxt-dev
      - run: npm ci
      - run: npm run build:renderer
      - run: npm run check

  build:
    needs: [prepare, validate]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tharindu-kulasinghe/fuchsius_system
          ssh-key: ${{ secrets.SOURCE_REPOSITORY_SSH_KEY }}
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - name: Prepare macOS notarization key
        if: matrix.platform == 'mac'
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Install Linux native build headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libxrandr-dev libxt-dev
      - run: npm ci
      - run: npm run build:renderer
      - name: Build platform artifacts
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never ${{ matrix.platform == 'mac' && '-c.forceCodeSigning=true -c.extraMetadata.macAutoUpdates=true' || '' }}
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Verify Mac app signature before upload
        if: matrix.platform == 'mac'
        run: node scripts/verify-mac-signature.cjs "${{ matrix.arch }}" --trusted
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 5

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tharindu-kulasinghe/fuchsius_system
          ssh-key: ${{ secrets.SOURCE_REPOSITORY_SSH_KEY }}
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false
      - name: Merge update manifests and verify artifacts
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORMS: ${{ needs.prepare.outputs.platforms }}
        run: node scripts/merge-release-metadata.js release-artifacts release-assets "$VERSION" "$PLATFORMS"
      - name: Publish complete GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --target main --title "Fuchsius $TAG" --notes "Fuchsius $TAG desktop installers. Updates download automatically on supported installations. Mac automatic updates require an Apple Developer ID signed release."
          fi
          while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --clobber
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release edit "$TAG" --draft=false --latest
